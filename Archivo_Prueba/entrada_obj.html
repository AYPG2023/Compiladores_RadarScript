<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salida del Programa - RadarScript</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0f172a;
            --panel: #111827;
            --panel-soft: #020617;
            --text: #e5e7eb;
            --muted: #cbd5e1;
            --accent: #38bdf8;
            --accent-strong: #0ea5e9;
            --code: #f8fafc;
            --border: rgba(148, 163, 184, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, rgba(56, 189, 248, 0.15), transparent 28%),
                linear-gradient(180deg, #020617 0%, var(--bg) 100%);
            color: var(--text);
            padding: 30px 18px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: var(--panel);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            color: var(--accent);
        }

        .info {
            color: var(--muted);
            margin-bottom: 18px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: var(--accent);
            color: #082f49;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .button.secondary {
            background: transparent;
            border-color: var(--border);
            color: var(--text);
        }

        .button:hover {
            background: var(--accent-strong);
            color: #e0f2fe;
        }

        .button.secondary:hover {
            background: rgba(148, 163, 184, 0.12);
        }

        pre {
            margin: 0;
            background: var(--panel-soft);
            color: var(--code);
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
            font-size: 15px;
            line-height: 1.6;
            border: 1px solid rgba(34, 197, 94, 0.15);
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RadarScript - Salida Final</h1>
        <p class="info">Archivo objeto asociado: entrada.obj</p>
        <div class="actions">
            <button class="button" type="button" onclick="window.location.reload()">Recargar visor</button>
            <a class="button secondary" href="javascript:history.back()">Volver</a>
        </div>
        <pre>ALERTA: Tormenta detectada en NORTE
REPORTE: Proceso finalizado</pre>
    </div>
</body>
</html>
